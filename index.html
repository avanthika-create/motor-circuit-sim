<!DOCTYPE html> 
<html> 
<head> 
    <title>Motor Circuit Simulator</title>

    <style>
        body { 
            background-color: #0b0f14;
            color: #00ff9d;
            font-family: "Courier New", monospace;
            margin: 0;
            padding: 0;
        }

        .container {
            padding: 30px
        }

        h1 { 
            color: #00ff9d;
            border-bottom: 1px sold #00ff9d;
            padding-bottom: 10px;
        }

        .panel {
            background: #111836;
            padding: 20px;
            margin-top: 20px;
            border: 1px solid #00ff9d;
            border-radius: 8px;
        }

        button { 
            background: black;
            color: #00ff9d;
            border: 1px solid #00ff9d; 
            padding: 10px 15px;
            cursor: pointer;
            margin-right: 10px;
        }

        button:hover {
            background: #00ff9d;
            color: black;
        }

        #output { 
            margin-top: 20px;
            white-space: pre-line;
        }
        
        .label { 
            color: #7affc6;
            font-size: 14px
        }

    </style>

</head>

<body> 
    <div class="container">
        <h1>Motor Circuit Simulation Lab</h1>

        <div class="panel">
            <p class="label">Experiment Controls</p>
            
            <button onclick="startExperiment()">Start Experiment</button>
            <buttom on click="showResults()">Show Results</button>
            <div id="output"></div>
        </div>
    </div>


<script>
    let results = [];

    function startExperiment() {
        results = [];
        runTrial(1);
    }
    
function runTrial(i) {

    if (i > 10) {
        showResults();
        return;
    }

    document.getElementById("output").innerText =
        "Trial " + i + "\nPreparing...";

    setTimeout(() => {

        document.getElementById("output").innerText =
            "Trial " + i + "\nGO! Click the button";

        const start = Date.now();

        const button = document.createElement("button");
        button.innerText = "CLICK NOW";
        document.body.appendChild(button);

        button.onclick = function () {

            const rt = (Date.now() - start) / 1000;
            results.push(rt);

            document.body.removeChild(button);

            document.getElementById("output").innerText =
                "Trial " + i + "\nReaction: " + rt.toFixed(3) + "s";

            setTimeout(() => runTrial(i + 1), 1000);
        };

    }, Math.random() * 2000 + 1000);
}

function showResults(){

let avg = results.reduce((a, b) => a + b) / results.length;
let min = Math.min(...results);
let max = Math.max(...results);

document.getElementById("output").innerText = 
    "FINAL REPORT\n\n" + 
            "Average: " + avg.toFixed(3) + "s\n" +
        "Fastest: " + min.toFixed(3) + "s\n" +
        "Slowest: " + max.toFixed(3) + "s\n\n" +
        results.map((r, i) =>
            "Trial " + (i + 1) + ": " + r.toFixed(3) + "s"
        ).join("\n");
}

</script>

</body>

</html>
